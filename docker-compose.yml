version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: capstone_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_project_db
    ports:
      - "3307:3306"
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: capstone_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PASSWORD=root # บังคับใช้รหัสผ่าน root สำหรับเชื่อมต่อ MySQL ใน Docker
    depends_on:
      - db

  ai:
    build: ./ai
    container_name: capstone_ai
    restart: always
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: capstone_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
      - ai

volumes:
  db_data:
